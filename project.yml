# XcodeGen spec: the .xcodeproj is generated (`make generate`), never hand-edited or committed.
name: PocketPalette
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PocketPalette:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - target: PocketPaletteWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/AppInfo.plist  # URL scheme, ATS exception for *.ts.net, PaletteServerURL prefill; the rest is generated
        CODE_SIGN_ENTITLEMENTS: App/Resources/PocketPalette.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Skips the "export compliance" prompt on every TestFlight build; set to YES if you add non-exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  PocketPaletteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - App/Sources/Core/WidgetSnapshot.swift  # the only app code the widget shares
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).widget
        CODE_SIGN_ENTITLEMENTS: Widget/PocketPaletteWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME) Widget
        INFOPLIST_FILE: Widget/Info.plist  # NSExtension point only; the rest is generated
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  PocketPaletteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      - Widget/PaletteWidget.swift  # the widget's views, rendered in WidgetShotTests (not a real widget host)
    dependencies:
      - target: PocketPalette
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_UNDER_TEST"
schemes:
  PocketPalette:
    build:
      targets:
        PocketPalette: all
    test:
      targets: [PocketPaletteTests]
    archive:
      config: Release
