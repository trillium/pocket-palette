# XcodeGen spec: the .xcodeproj is generated (`make generate`), never hand-edited or committed.
name: PocketPalette
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Beta is a Release build with a sibling bundle id, name, icon and App Group (Config/Beta.xcconfig); scheme "PocketPalette Beta"
# builds the app and its widget extension.
configs:
  Debug: debug
  Release: release
  Beta: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  Beta: Config/Beta.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PocketPalette:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - target: PocketPaletteWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/AppInfo.plist  # URL scheme, ATS exceptions for ts.net and the min-version host, MinVersionURL, PaletteServerURL prefill; the rest is generated
        # A plist key cannot hold a build setting, so SIDE_HOST reaches the ATS exception's key through the preprocessor.
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: SIDE_HOST_NAME=$(SIDE_HOST)
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: -traditional
        CODE_SIGN_ENTITLEMENTS: App/Resources/PocketPalette.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Skips the "export compliance" prompt on every TestFlight build; set to YES if you add non-exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Beta:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Beta
          # The Swift module keeps the plain app name so `@testable import PocketPalette` and the sources are unaffected.
          PRODUCT_MODULE_NAME: PocketPalette
  PocketPaletteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - App/Sources/Core/WidgetSnapshot.swift  # the only app code the widget shares
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).widget
        CODE_SIGN_ENTITLEMENTS: Widget/PocketPaletteWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME) Widget
        INFOPLIST_FILE: Widget/Info.plist  # NSExtension point only; the rest is generated
        SKIP_INSTALL: YES
        # Beta renames the app's PRODUCT_NAME project-wide (Config/Beta.xcconfig); the widget keeps its own.
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
  PocketPaletteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      - Widget/PaletteWidget.swift  # the widget's views, rendered in WidgetShotTests (not a real widget host)
    dependencies:
      - target: PocketPalette
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_UNDER_TEST"
schemes:
  "PocketPalette Beta":
    build:
      targets:
        PocketPalette: all
    run:
      config: Beta
    profile:
      config: Beta
    archive:
      config: Beta
  PocketPalette:
    build:
      targets:
        PocketPalette: all
    test:
      targets: [PocketPaletteTests]
    archive:
      config: Release
